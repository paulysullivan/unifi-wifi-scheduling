services:
  app:
    build: .
    ports:
      - "${PORT:-7323}:${PORT:-7323}"
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/network_schedule.db
      - STATIC_DIR=/app/static
      - TZ=${TZ:-America/New_York}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${PORT:-7323}/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
